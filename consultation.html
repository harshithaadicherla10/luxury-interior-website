<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Book Consultation | LuxeSpace</title>

    <link rel="stylesheet" href="consultation.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <nav>

            <h2 class="logo">LuxeSpace</h2>

            <div class="nav-links">

                <a href="index.html">Home</a>
                <a href="designs.html">Designs</a>
                <a href="#">Consultation</a>

            </div>

        </nav>

    </header>

    <!-- Consultation Section -->

    <section class="consultation">

        <div class="consultation-container">

            <!-- Left -->

            <div class="consultation-text">

                <h1>Book Your Luxury Consultation</h1>

                <p>
                    Connect with our expert designers and transform your
                    dream interiors into reality with personalized luxury solutions.
                </p>

                <div class="features">

                    <div class="feature-box">
                        <h3>✔ Expert Designers</h3>
                    </div>

                    <div class="feature-box">
                        <h3>✔ Modern Luxury Concepts</h3>
                    </div>

                    <div class="feature-box">
                        <h3>✔ Personalized Planning</h3>
                    </div>

                </div>

            </div>

            <!-- Right -->

            <div class="consultation-form">

                <form>

                    <input type="text"
                        placeholder="Full Name"
                        required>

                    <input type="email"
                        placeholder="Email Address"
                        required>

                    <input type="tel"
                        placeholder="Phone Number"
                        required>

                    <select required>

                        <option>Select Service</option>

                        <option>Interior Design</option>

                        <option>Architecture Planning</option>

                        <option>Furniture Design</option>

                    </select>

                    <input type="date" required>

                    <textarea rows="6"
                        placeholder="Tell us about your dream space"></textarea>

                    <button type="submit">
                        Book Consultation
                    </button>

                </form>

            </div>

        </div>

    </section>

</body>

</html>
